<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cartelera - Responsable de planta</title>
    <link rel="stylesheet" href="/styles.css">
    <meta http-equiv="refresh" content="10">
</head>

<body class="display-body">

<main class="display-container">

    <h1 th:text="${plantName}">PLANTA EZEIZA</h1>
    <h2 th:text="${mainTitle}">Responsable de planta</h2>

    <section th:if="${responsible != null}" class="display-card">
        <p class="display-name" th:text="${responsible.fullName}">
            Nombre Apellido
        </p>
        <p class="display-position" th:text="${responsible.position}">
            Cargo
        </p>
    </section>

    <section th:if="${responsible == null}" class="display-card">
        <p class="display-warning">No hay responsable disponible</p>
    </section>

</main>

</body>
</html>
