# Este archivo SOLO se carga si el perfil "entra" esta activo
# (SPRING_PROFILES_ACTIVE=entra). Si no se activa este perfil,
# ninguna de estas propiedades existe para la aplicacion y el
# login local sigue funcionando exactamente igual que hoy.
#
# Los valores reales (Client ID, Client Secret, Tenant ID) los provee
# el equipo de IT al crear el App Registration en Azure Portal, y se
# cargan como variables de entorno del sistema, nunca hardcodeados aca.

spring.security.oauth2.client.registration.azure.client-id=${ENTRA_CLIENT_ID}
spring.security.oauth2.client.registration.azure.client-secret=${ENTRA_CLIENT_SECRET}
spring.security.oauth2.client.registration.azure.scope=openid,profile,email
spring.security.oauth2.client.registration.azure.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.azure.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.azure.issuer-uri=https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
